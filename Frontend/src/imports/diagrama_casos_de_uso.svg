<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: Arial, sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- TÍTULO -->
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Sistema de Controle de Ferramentas e Empréstimos</text>

  <!-- BOUNDARY BOX -->
  <rect x="160" y="35" width="360" height="740" rx="12" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- ===== CASOS DE USO ===== -->

  <!-- UC01 Cadastrar ferramenta -->
  <ellipse cx="340" cy="100" rx="115" ry="27" fill="#d4f0e8" stroke="#0f6e56" stroke-width="1.2"/>
  <text x="340" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Cadastrar ferramenta</text>

  <!-- UC02 Consultar disponibilidade -->
  <ellipse cx="340" cy="178" rx="115" ry="27" fill="#d4f0e8" stroke="#0f6e56" stroke-width="1.2"/>
  <text x="340" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Consultar disponibilidade</text>

  <!-- UC03 Registrar empréstimo -->
  <ellipse cx="340" cy="278" rx="115" ry="27" fill="#cecbf6" stroke="#534ab7" stroke-width="1.2"/>
  <text x="340" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215c">Registrar empréstimo</text>

  <!-- UC04 Vincular responsável (include) -->
  <ellipse cx="340" cy="358" rx="115" ry="27" fill="#e8e8e8" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="340" y="351" text-anchor="middle" font-size="11" font-weight="bold" fill="#444441">Vincular responsável</text>
  <text x="340" y="366" text-anchor="middle" font-size="10" fill="#5f5e5a">«include»</text>

  <!-- UC05 Registrar devolução -->
  <ellipse cx="340" cy="450" rx="115" ry="27" fill="#cecbf6" stroke="#534ab7" stroke-width="1.2"/>
  <text x="340" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215c">Registrar devolução</text>

  <!-- UC06 Atualizar status (include) -->
  <ellipse cx="340" cy="530" rx="115" ry="27" fill="#e8e8e8" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="340" y="523" text-anchor="middle" font-size="10" font-weight="bold" fill="#444441">Atualizar status da ferramenta</text>
  <text x="340" y="538" text-anchor="middle" font-size="10" fill="#5f5e5a">«include»</text>

  <!-- UC07 Consultar histórico de uso -->
  <ellipse cx="340" cy="630" rx="115" ry="27" fill="#fac775" stroke="#854f0b" stroke-width="1.2"/>
  <text x="340" y="626" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">Consultar histórico de uso</text>

  <!-- UC08 Gerar relatório gerencial (extend) -->
  <ellipse cx="340" cy="720" rx="115" ry="27" fill="#e8e8e8" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="340" y="713" text-anchor="middle" font-size="11" font-weight="bold" fill="#444441">Gerar relatório gerencial</text>
  <text x="340" y="728" text-anchor="middle" font-size="10" fill="#5f5e5a">«extend»</text>

  <!-- ===== ATORES ===== -->

  <!-- ATOR: Técnico / Colaborador (esquerda) -->
  <circle cx="72" cy="310" r="16" fill="none" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="326" x2="72" y2="368" stroke="#333333" stroke-width="1.8"/>
  <line x1="44" y1="344" x2="100" y2="344" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="368" x2="50" y2="396" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="368" x2="94" y2="396" stroke="#333333" stroke-width="1.8"/>
  <text x="72" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Técnico /</text>
  <text x="72" y="426" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Colaborador</text>

  <!-- ATOR: Almoxarife (esquerda, abaixo) -->
  <circle cx="72" cy="490" r="16" fill="none" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="506" x2="72" y2="548" stroke="#333333" stroke-width="1.8"/>
  <line x1="44" y1="524" x2="100" y2="524" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="548" x2="50" y2="576" stroke="#333333" stroke-width="1.8"/>
  <line x1="72" y1="548" x2="94" y2="576" stroke="#333333" stroke-width="1.8"/>
  <text x="72" y="592" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Almoxarife</text>

  <!-- ATOR: Coordenador (direita) -->
  <circle cx="612" cy="400" r="16" fill="none" stroke="#333333" stroke-width="1.8"/>
  <line x1="612" y1="416" x2="612" y2="458" stroke="#333333" stroke-width="1.8"/>
  <line x1="584" y1="434" x2="640" y2="434" stroke="#333333" stroke-width="1.8"/>
  <line x1="612" y1="458" x2="590" y2="486" stroke="#333333" stroke-width="1.8"/>
  <line x1="612" y1="458" x2="634" y2="486" stroke="#333333" stroke-width="1.8"/>
  <text x="612" y="502" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Coordenador</text>

  <!-- ===== ASSOCIAÇÕES (linhas sólidas) ===== -->

  <!-- Técnico → Consultar disponibilidade -->
  <line x1="88" y1="300" x2="224" y2="184" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Técnico → Registrar empréstimo -->
  <line x1="88" y1="318" x2="224" y2="278" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Técnico → Registrar devolução -->
  <line x1="88" y1="334" x2="224" y2="444" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Almoxarife → Cadastrar ferramenta -->
  <line x1="88" y1="480" x2="224" y2="114" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Almoxarife → Registrar empréstimo -->
  <line x1="88" y1="496" x2="224" y2="282" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Almoxarife → Registrar devolução -->
  <line x1="88" y1="510" x2="224" y2="452" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Coordenador → Consultar disponibilidade -->
  <line x1="596" y1="388" x2="456" y2="188" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Coordenador → Consultar histórico de uso -->
  <line x1="596" y1="408" x2="456" y2="628" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Coordenador → Gerar relatório gerencial -->
  <line x1="596" y1="416" x2="456" y2="714" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== INCLUDE / EXTEND (tracejadas) ===== -->

  <!-- include: Registrar empréstimo → Vincular responsável -->
  <line x1="340" y1="305" x2="340" y2="330" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>

  <!-- include: Registrar devolução → Atualizar status -->
  <line x1="340" y1="477" x2="340" y2="502" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>

  <!-- extend: Consultar histórico → Gerar relatório -->
  <line x1="340" y1="657" x2="340" y2="692" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>

  <!-- ===== LEGENDA ===== -->
  <rect x="476" y="50" width="168" height="90" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
  <text x="488" y="68" font-size="11" font-weight="bold" fill="#222222">Legenda</text>
  <line x1="488" y1="86" x2="524" y2="86" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="90" font-size="10" fill="#333333">Associação</text>
  <line x1="488" y1="106" x2="524" y2="106" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text x="530" y="110" font-size="10" fill="#333333">Include / Extend</text>
  <ellipse cx="504" cy="126" rx="14" ry="8" fill="#e8e8e8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="524" y="130" font-size="10" fill="#333333">Caso de uso</text>

</svg>
